<!doctype html>
<html lang="en" class="color-root" data-root="../">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <title>Color — Color Names</title>

      name="description"
      content="One color from the Color Names list: its name, what it looks like in words, and what Wikipedia knows about it."

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Color Names" />
    <meta
      property="og:description"
      content="{{colorCount}} colors, each named by a person: wander through them, hanging where their color is."

    <meta property="og:url" content="https://names.color.pizza/" />
    <meta property="og:site_name" content="Color Names" />
    <meta property="og:image" content="https://names.color.pizza/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Color Names logo over a cube of {{colorCount}} named colors" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "dd43c592f6554361bb4db99b709d15cd", "spa": true}'
    ></script>
  </head>
  <body>
    <main class="color-page">
      <section class="slide slide--invert hero color-hero" data-slide>
        <a class="brand color-hero__home" href="../"
          ><svg class="brand__logo" viewBox="20 12 130 158" aria-hidden="true">
            <path d="M30 170h80v-60a39.8 39.8 0 0 0-5.25-19.81A80 80 0 0 0 30 170z" fill="#f69" />
            <path
              class="brand__crest brand__crest--1"
              d="M80.36 81.34L63 71.34c-.73-.42-1.42-.87-2.1-1.34H20a30 30 0 0 0 30 30h20a10.07 10.07 0 0 1 1.15.07 79.54 79.54 0 0 1 13.28-5.87 10 10 0 0 0-4.07-12.86z"
              fill="#ed0"
            />
            <path
              class="brand__crest brand__crest--2"
              d="M70 70h-9.06c.68.47 1.37.92 2.1 1.34l17.32 10a10 10 0 0 1 4.07 12.86 79.64 79.64 0 0 1 20.32-4A40 40 0 0 0 70 70z"
              fill="#5a0"
            />
            <path
              class="brand__crest brand__crest--2"
              d="M98.66 70.36L88.66 53c-.42-.73-.8-1.46-1.15-2.21L78 45.36l-26-15A30 30 0 0 0 60.94 70H70a39.86 39.86 0 0 1 28 11.41 10 10 0 0 0 .66-11.05z"
              fill="#6c6"
            />
            <path
              class="brand__crest brand__crest--3"
              d="M120 70V50c0-.84 0-1.67.11-2.49L114.64 38l-15-26a30 30 0 0 0-12.13 38.83l7.85 4.53a39.86 39.86 0 0 1 18.51 23.86A10 10 0 0 0 120 70z"
              fill="#19f"
            />
            <path
              class="brand__crest brand__crest--3"
              d="M114 100.2a40 40 0 0 0-18.64-44.84l-7.85-4.53c.35.74.73 1.48 1.15 2.21l10 17.32A10 10 0 0 1 98 81.41 40 40 0 0 1 108.74 100H110q2 0 4 .2z"
              fill="#176"
            />
            <path
              class="brand__crest brand__crest--4"
              d="M120.11 47.51l4.53 7.85a40 40 0 0 1-4.25 46 39.74 39.74 0 0 1 9 3.63A40 40 0 0 0 150 70V20a30 30 0 0 0-29.89 27.51z"
              fill="#f69"
            />
            <path
              class="brand__crest brand__crest--4"
              d="M110 110a39.81 39.81 0 0 0 19.37-5 39.47 39.47 0 0 0-9-3.63 40 40 0 0 0 4.25-46l-4.53-7.85c-.07.82-.11 1.65-.11 2.49V70a10 10 0 0 1-6.13 9.22 40 40 0 0 1 .17 21s-2.51-.2-4.05-.2h-1.27A39.89 39.89 0 0 1 110 110z"
              fill="#139"
            />
            <path
              class="brand__beak brand__beak--top"
              d="M129.37 105a39.81 39.81 0 0 1-19.37 5v20a10 10 0 0 0 10 10h30a40 40 0 0 0-20.63-35z"
              fill="#19f"
            />
            <path
              class="brand__beak brand__beak--bottom"
              d="M120 140a10 10 0 0 1-10-10v40a30 30 0 0 0 30-30z"
              fill="#ed0"
            />
            <circle cx="87.5" cy="127.5" r="7.5" fill="#fff" /></svg
          ><span>Color Names</span></a
        >
        <a class="color-hero__close" href="../" data-close aria-label="Back to Color Names">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </a>

        <div class="color-hero__card" data-place>
          <div class="swatchcard" data-card>
            <div class="swatchcard__upper">
              <i class="swatchcard__swatch" aria-hidden="true">
                <i class="swatchcard__shade"></i><i class="swatchcard__shade"></i><i class="swatchcard__shade"></i>
              </i>
            </div>
            <div class="swatchcard__label">
              <div class="swatchcard__info">
                <span class="swatchcard__row1" data-value></span>
                <span class="swatchcard__row2" data-card-name></span>
              </div>
            </div>
          </div>
        </div>
        <script>
          try {
            const h = JSON.parse(sessionStorage.getItem("card-handoff"));
            const html = document.documentElement;
            const own = html.style.getPropertyValue("--page-color");
            if (h?.whole && (!own || own === h.hex)) {
              const place = document.currentScript.previousElementSibling;
              const card = place.firstElementChild;
              html.classList.add("is-arriving", "is-passed-on");
              place.style.cssText = `--x:${h.place.x.toFixed(3)};--y:${h.place.y.toFixed(3)};--r:${h.place.r.toFixed(1)}deg`;
              place.classList.add("is-placed");
              card.style.cssText = h.style;
              card.classList.add("swatchcard--reset", "swatchcard--visible");
              card.querySelector("[data-value]").textContent = h.hex;
              card.querySelector("[data-card-name]").textContent = h.name;
              if (h.pixel) {
                html.classList.add("is-pixel");
                const img = Object.assign(new Image(), {
                  className: "swatchcard__pixel swatchcard__pixel--now",
                  alt: "",
                  src: h.pixel.src,
                });
                img.dataset.slug = h.pixel.slug;
                card.querySelector(".swatchcard__upper").append(img);
              }
            }
          } catch {}
        </script>

        <div class="hero__content">
          <h1 class="hero__title" data-name></h1>
          <div class="color-hero__intro" data-intro></div>
          <p class="hero__stats" data-stats></p>
        </div>
      </section>

      <section class="slide slide--dense color-art is-filling" id="art" data-slide data-art-slide>
        <div class="gallery" data-art></div>
      </section>

      <section class="slide slide--dense color-fill" id="formats" data-fill>
        <h2 class="figure color-fill__hex" data-fill-hex></h2>
        <div class="color-fill__ink" data-ink></div>
        <dl class="color-specs color-specs--formats" data-formats></dl>
        <dl class="color-specs" data-mix></dl>
      </section>

      <section class="slide slide--dense is-filling" id="words" data-slide data-words-slide>
        <h2 class="display color-words__title" data-words-title></h2>
        <div class="color-about" data-about></div>
        <dl class="color-specs color-specs--words" data-words></dl>
      </section>

      <section class="slide slide--dense is-filling" id="meaning" data-slide data-meaning-slide>
        <h2 class="display color-meaning__title" data-meaning-title></h2>
        <div class="color-dictionary" data-dictionary></div>
        <div class="color-wiki" data-wiki aria-live="polite"></div>
      </section>

      <section class="slide slide--dense is-filling" id="neighbors" data-slide data-neighbors-slide>
        <h2 class="display">Its neighbors.</h2>
        <div class="neighbors" data-neighbors></div>
        <h2 class="display color-next" id="complements">Its complements.</h2>
        <div class="neighbors neighbors--ramp" data-complements></div>
        <h2 class="display color-next" id="ramp">As a ramp.</h2>
        <div class="neighbors neighbors--ramp" data-ramp></div>
      </section>

      <footer class="slide footer" id="share" data-slide>
        <h2 class="display" data-outro>Use it, share it.</h2>
        <p class="lead footer__about">
          Color Names is an open list of names for colors, each one given by a person. Free to use, under the MIT
          license.
        </p>
        <p class="footer__adopt" data-footer-adopt hidden>
          <a href="../adopt/"
            >Adopt this color
            <svg class="hero__heart" viewBox="0 1 24 22" aria-hidden="true">
              <path
                class="hero__heart-edge"
                d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"
              ></path>
              <path
                d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"
              ></path></svg
          ></a>
        </p>
        <nav class="footer__nav" aria-label="Project links">
          <a href="../">Color Names</a>
          <a href="../supporters/">Supporters</a>
          <span class="footer__share">
            <a data-page-link href="./"></a>
            <button type="button" data-share aria-label="Share this color">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path
                  d="M10 12.5V3M6.5 6.5 10 3l3.5 3.5M5.5 9.5H5a1 1 0 0 0-1 1V16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-5.5a1 1 0 0 0-1-1h-.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </span>
        </nav>
      </footer>

      <footer class="colophon" data-colophon>
        <nav class="colophon__nav" aria-label="The list">
          <a href="https://github.com/meodai/color-names">GitHub<span data-version></span></a>
          <a href="https://www.npmjs.com/package/color-name-list">npm</a>
          <a href="https://meodai.github.io/color-name-api/">API</a>
          <a href="https://github.com/meodai/color-names/blob/main/LICENSE">License</a>
          <a href="../legal/">Legal</a>
        </nav>
        <p class="colophon__color" data-colophon-color></p>
      </footer>
    </main>

    <script type="module" blocking="render">
      import { initDetailPage } from "/src/detail.js";
      initDetailPage();
    </script>
  </body>
</html>
