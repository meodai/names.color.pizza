# Every night: keeps the site's copy of what Wikipedia and Wiktionary say
# about each color name (the data branch) up to date. Names new on the list
# are fetched, and the oldest copies renewed, 1/180 of the list a night, so
# each copy is renewed about every six months; each with the Commons
# pictures that have its color in them. The rest of the night picks pictures
# for copies that have none yet. Then the site is rebuilt with it.

name: Data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: meodai/color-names
          path: color-names
      - uses: actions/checkout@v5
        with:
          ref: data
          path: .data
      # a first fill running elsewhere marks itself; then this waits
      - name: Check for a fill in progress
        id: filling
        run: |
          if [ -f .data/FILLING ]; then
            echo "A first fill is running elsewhere; skipping tonight."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.filling.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.filling.outputs.skip != 'true'
        run: npm ci
      - if: steps.filling.outputs.skip != 'true'
        name: Collect
        env:
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
        run: |
          node scripts/collect.mjs --with-pictures --minutes 180
          node scripts/collect.mjs --pictures --minutes 110
      - if: steps.filling.outputs.skip != 'true'
        name: Save
        working-directory: .data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data: $(date -u +%F)"
          git pull -q --rebase origin data
          git push origin HEAD:data
      # a push made with the workflow token doesn't start other workflows;
      # a dispatch does
      - if: steps.filling.outputs.skip != 'true'
        name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
