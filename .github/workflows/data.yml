# Keeps the site's copy of what Wikipedia and Wiktionary say about each color
# name (the data branch) up to date, each with the Commons pictures that have
# its color in them. Every night: just the names new on the list. On the 1st
# of the month (or run by hand with "month"): the oldest sixth of the copies
# renewed, so each is renewed about every six months, and pictures looked for
# the copies that have none yet. Then the site is rebuilt with it.

name: Data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      month:
        description: "The month's run: renew the oldest copies and look for missing pictures"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: meodai/color-names
          path: color-names
      - uses: actions/checkout@v5
        with:
          ref: data
          path: .data
      # a first fill running elsewhere marks itself; then this waits
      - name: Check for a fill in progress
        id: filling
        run: |
          if [ -f .data/FILLING ]; then
            echo "A first fill is running elsewhere; skipping tonight."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.filling.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.filling.outputs.skip != 'true'
        id: install
        run: npm ci
      # each pass a step of its own, and what they collected saved even when one fails;
      # a pass that overruns is stopped as a failure, not the job cancelled with it
      - if: steps.install.outcome == 'success'
        name: Which run
        id: run
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ inputs.month }}" = "true" ]; then
            echo "month=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.install.outcome == 'success' && steps.run.outputs.month != 'true'
        name: Collect the new names
        timeout-minutes: 70
        env:
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
        run: node scripts/collect.mjs --with-pictures --new --minutes 60
      - if: steps.install.outcome == 'success' && steps.run.outputs.month == 'true'
        name: Collect
        timeout-minutes: 190
        env:
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
        run: node scripts/collect.mjs --with-pictures --every 30 --minutes 180
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.run.outputs.month == 'true' }}
        name: Collect pictures
        timeout-minutes: 120
        env:
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
        run: node scripts/collect.mjs --pictures --minutes 110
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        name: Save
        id: save
        working-directory: .data
        run: |
          rm -f names/*/*.tmp
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data: $(date -u +%F)"
          git pull -q --rebase origin data
          git push origin HEAD:data
          echo "saved=true" >> "$GITHUB_OUTPUT"
      # a push made with the workflow token doesn't start other workflows;
      # a dispatch does
      - if: ${{ !cancelled() && steps.save.outputs.saved == 'true' }}
        name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
