# Builds the site and deploys it to names.color.pizza (GitHub Pages). The
# list and its history come from the names repo, the nightly copies from
# the data branch, the descriptions from the descriptions branch. Daily at
# 05:45 UTC too, after the nightly data (03:17) and descriptions (05:17), so
# what they bring goes live without a push.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**", "CLAUDE.md"]
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:
    inputs:
      list_before:
        description: "The list's commit to announce names since, when the site doesn't say (list.txt)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      listBefore: ${{ steps.list.outputs.before }}
      listNow: ${{ steps.list.outputs.now }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: meodai/color-names
          path: color-names
          fetch-depth: 0 # added.mjs reads the list's whole history
      - uses: actions/checkout@v5
        with:
          ref: data
          path: .data
      - uses: actions/checkout@v5
        with:
          ref: descriptions
          path: .descriptions
      - uses: actions/checkout@v5
        with:
          repository: meodai/art-colors
          path: .data/art-colors
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install oxipng
        run: |
          curl -sSL https://github.com/oxipng/oxipng/releases/download/v10.2.1/oxipng-10.2.1-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin oxipng-10.2.1-x86_64-unknown-linux-musl/oxipng \
            || echo "no oxipng; previews stay unoptimized"
      - uses: actions/cache@v4
        with:
          path: .cache/previews
          key: previews-${{ github.run_id }}
          restore-keys: previews-
      - uses: actions/cache@v4
        with:
          path: .cache/lists
          key: lists-${{ github.run_id }}
          restore-keys: lists-
      - name: Build
        env:
          UPLOAD_URL: ${{ vars.UPLOAD_URL }}
          UPLOAD_KEY: ${{ secrets.UPLOAD_KEY }}
        run: npm run build
      # which commit of the list this build shows, beside the one the site showed till now
      - name: The list's commit
        id: list
        run: |
          before="${{ inputs.list_before }}"
          echo "before=${before:-$(curl -sf https://names.color.pizza/list.txt || true)}" >> "$GITHUB_OUTPUT"
          git -C color-names rev-parse HEAD | tee dist/list.txt
          echo "now=$(cat dist/list.txt)" >> "$GITHUB_OUTPUT"
      # each deploy replaces the whole site: the last one's hashed assets ride along, so a page
      # still open or cached from before doesn't 404 on its scripts. Only this build's own are
      # listed, so the ones carried go with the next deploy
      - name: Keep the last deploy's assets
        run: |
          (cd dist/assets && ls) > dist/assets.txt
          live=https://names.color.pizza
          last=$(curl -sf $live/assets.txt || true)
          # no list online yet: what the pages and their scripts name
          if [ -z "$last" ]; then
            for p in / /adopt/ /supporters/ /legal/ /color/ /not-found/; do curl -sf "$live$p" || true; done > pages.txt
            for f in $(grep -oE 'assets/[A-Za-z0-9._-]+' pages.txt | sort -u); do curl -sf "$live/$f" || true; done >> pages.txt
            last=$(grep -oE '[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8}\.(js|css|svg)' pages.txt | sort -u)
          fi
          for f in $last; do
            [ -e "dist/assets/$f" ] || curl -sf -o "dist/assets/$f" "https://names.color.pizza/assets/$f" || true
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # the names now online get a comment on the commit that added them, in the names repo
  online:
    needs: [build, deploy]
    if: needs.build.outputs.listBefore != needs.build.outputs.listNow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: meodai/color-names
          path: color-names
          fetch-depth: 0
      - name: Say which names are online
        env:
          GH_TOKEN: ${{ secrets.NAMES_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "no NAMES_REPO_TOKEN; nothing said"; exit 0; fi
          node scripts/online.mjs "${{ needs.build.outputs.listBefore }}" "${{ needs.build.outputs.listNow }}"
